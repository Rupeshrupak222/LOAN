version: '3.8'

services:
  # 1. PostgreSQL 15 Database
  postgres:
    image: postgres:15-alpine
    container_name: adyapan-postgres
    restart: always
    environment:
      POSTGRES_DB: adyapan_lms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-adyapan_secure_prod_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adyapan_lms"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adyapan-network

  # 2. Redis 7 Alpine Cache & Queue Store
  redis:
    image: redis:7-alpine
    container_name: adyapan-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-adyapan_redis_secure_pass_2026}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - adyapan-network

  # 3. Adyapan Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adyapan-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-adyapan_secure_prod_password_2026}@postgres:5432/adyapan_lms?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-adyapan_redis_secure_pass_2026}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-adyapan_prod_access_jwt_secret_min_32_chars_long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-adyapan_prod_refresh_jwt_secret_min_32_chars_long}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - adyapan-network

  # 4. Adyapan Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adyapan-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://backend:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - adyapan-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  adyapan-network:
    driver: bridge
